databases:
  - name: nerds-db
    plan: free
    databaseName: nerds
    user: nerds

services:
  - type: web
    name: nerds-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nerds-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DONATION_POOL_PERCENT
        value: "10"
      - key: CORS_ORIGIN
        sync: false
