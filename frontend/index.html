<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>nerds</title>
    <!-- Boot splash: inline so it paints before the JS bundle loads. Removed by src/lib/preload.ts. -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(circle at 50% 38%, rgba(155, 138, 251, 0.28), transparent 55%),
          linear-gradient(160deg, #4640de 0%, #2f2b9c 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 320ms cubic-bezier(0.25, 0.1, 0.25, 1), visibility 320ms;
      }
      .splash--hidden {
        opacity: 0;
        visibility: hidden;
      }
      /* Three podium bars rising in turn, a nod to the leaderboard. */
      .splash__podium {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 84px;
      }
      .splash__bar {
        width: 26px;
        border-radius: 8px 8px 4px 4px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 8px 24px rgba(10, 8, 60, 0.35);
        transform-origin: bottom;
        animation: splash-rise 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .splash__bar--2 { height: 58px; animation-delay: 0s; }
      .splash__bar--1 { height: 84px; animation-delay: 0.15s; position: relative; }
      .splash__bar--3 { height: 42px; animation-delay: 0.3s; }
      .splash__bar--1::before {
        content: '';
        position: absolute;
        left: 50%;
        top: -22px;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        border-radius: 50%;
        background: #ffc93c;
        box-shadow: 0 0 18px rgba(255, 201, 60, 0.8);
        animation: splash-bob 1.2s ease-in-out infinite;
      }
      .splash__word {
        margin: 0;
        font-size: 26px;
        font-weight: 750;
        letter-spacing: 0.02em;
      }
      .splash__dots::after {
        content: '';
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: splash-dots 1.2s steps(4, end) infinite;
      }
      @keyframes splash-rise {
        0% { transform: scaleY(0.25); opacity: 0.55; }
        45% { transform: scaleY(1); opacity: 1; }
        100% { transform: scaleY(0.25); opacity: 0.55; }
      }
      @keyframes splash-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes splash-dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__bar, .splash__bar--1::before, .splash__dots::after { animation: none; }
        .splash__dots::after { content: '…'; }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="status" aria-live="polite" aria-busy="true">
      <div class="splash__podium" aria-hidden="true">
        <span class="splash__bar splash__bar--2"></span>
        <span class="splash__bar splash__bar--1"></span>
        <span class="splash__bar splash__bar--3"></span>
      </div>
      <p class="splash__word">nerds<span class="splash__dots"></span></p>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
